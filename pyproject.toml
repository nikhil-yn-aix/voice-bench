[project]
name = "voice-bench"
version = "0.1.0"
description = "Reproducible CPU-only ASR and TTS deployment benchmark"
requires-python = ">=3.11,<3.13"
dependencies = [
  "jiwer>=4,<5",
  "numpy>=1.26,<3",
  "psutil>=7,<8",
  "soundfile>=0.13,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
  "huggingface-hub>=0.34,<2",
  "matplotlib>=3.10,<4",
  "pytest>=8,<10",
  "rich>=14,<15",
  "ruff>=0.12,<1",
]
data = ["datasets>=4.0,<5", "rich>=14,<15", "scipy>=1.15,<2"]
moonshine = ["moonshine-voice==0.0.71", "onnxruntime>=1.22,<2", "scipy>=1.15,<2"]
whisper = ["pywhispercpp>=1.3,<2", "onnxruntime>=1.22,<2", "scipy>=1.15,<2"]
parakeet = [
  "scipy>=1.15,<2",
  "sherpa-onnx==1.13.5",
  "sherpa-onnx-bin==1.13.5",
  "sherpa-onnx-core==1.13.5",
]
pocket = ["pocket-tts>=2.1,<3"]
kokoro = [
  "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
  "kokoro>=0.9,<1",
  "torch>=2.7,<3",
]
chatterbox = ["chatterbox-tts @ git+https://github.com/resemble-ai/chatterbox.git@5de7a54aa4e5e2baadb0182dde554908b48b85c2"]
kitten = ["kittentts @ https://github.com/KittenML/KittenTTS/releases/download/0.8.1/kittentts-0.8.1-py3-none-any.whl"]
piper = ["piper-tts==1.4.2"]

[tool.uv]
default-groups = ["dev"]
conflicts = [
  [
    { group = "moonshine" },
    { group = "whisper" },
    { group = "parakeet" },
    { group = "pocket" },
    { group = "kokoro" },
    { group = "chatterbox" },
    { group = "kitten" },
    { group = "piper" },
    { group = "data" },
  ],
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
